when:
  - event: tag

steps:
  - name: validate lha release tag
    image: alpine/git
    commands:
      - |
        set -eu
        LHA_VERSION="$CI_COMMIT_TAG"
        case "$LHA_VERSION" in
          v3.17-lha-[0-9]*.[0-9]*.[0-9]*) ;;
          *) echo "Invalid LHA release tag: $LHA_VERSION (expected v3.17-lha-<semver>)" >&2; exit 1 ;;
        esac
        test -n "$CI_COMMIT_SHA"
        BRANCH_SHA="$(git ls-remote origin refs/heads/v3.17-lha | awk '{print $1}')"
        test -n "$BRANCH_SHA"
        if [ "$CI_COMMIT_SHA" != "$BRANCH_SHA" ]; then
          echo "Release tag $LHA_VERSION points to $CI_COMMIT_SHA, but v3.17-lha currently points to $BRANCH_SHA." >&2
          echo "Refusing to move v3.17-lha/latest image aliases backwards. Tag the current v3.17-lha tip instead." >&2
          exit 1
        fi
        echo "LHA Play CI release: $LHA_VERSION"
        echo "Source commit: $CI_COMMIT_SHA"
        echo "v3.17-lha tip: $BRANCH_SHA"

  - name: publish lha server
    image: woodpeckerci/plugin-kaniko
    depends_on:
      - validate lha release tag
    settings:
      registry: registry.lhaplay.com
      repo: woodpecker/server
      dockerfile: docker/Dockerfile.server.fork
      context: .
      tags:
        - ${CI_COMMIT_SHA}
        - ${CI_COMMIT_TAG}
        - v3.17-lha
        - latest
      build_args:
        - LHA_WOODPECKER_VERSION=${CI_COMMIT_TAG}
      username: lha-registry
      password:
        from_secret: registry_password

  - name: publish lha agent
    image: woodpeckerci/plugin-kaniko
    depends_on:
      - validate lha release tag
    settings:
      registry: registry.lhaplay.com
      repo: woodpecker/agent
      dockerfile: docker/Dockerfile.agent.alpine.multiarch
      context: .
      tags:
        - ${CI_COMMIT_SHA}
        - ${CI_COMMIT_TAG}
        - v3.17-lha
        - latest
      build_args:
        - LHA_WOODPECKER_VERSION=${CI_COMMIT_TAG}
        - CI_COMMIT_SHA=${CI_COMMIT_SHA}
      username: lha-registry
      password:
        from_secret: registry_password

  - name: publish version to cyclops catalog
    image: python:3.13-alpine
    depends_on:
      - publish lha server
      - publish lha agent
    environment:
      CYCLOPS_TEMPLATES_TOKEN:
        from_secret: gitops_token
    commands:
      - |
        set -eu
        python - <<'PY'
        import base64
        import json
        import os
        import time
        import urllib.error
        import urllib.request

        token = os.environ.get("CYCLOPS_TEMPLATES_TOKEN", "")
        version = os.environ.get("CI_COMMIT_TAG", "")
        if not token:
            raise SystemExit("missing CYCLOPS_TEMPLATES_TOKEN")
        if not version:
            raise SystemExit("missing CI_COMMIT_TAG")

        repo = "bredchalice/lha-cyclops-templates"
        path = "lha-play-environment/values.schema.json"
        read_url = f"https://api.github.com/repos/{repo}/contents/{path}?ref=master"
        write_url = f"https://api.github.com/repos/{repo}/contents/{path}"
        headers = {
            "Accept": "application/vnd.github+json",
            "Authorization": f"Bearer {token}",
            "X-GitHub-Api-Version": "2022-11-28",
            "User-Agent": "LHA-Play-CI",
        }

        for attempt in range(1, 6):
            with urllib.request.urlopen(urllib.request.Request(read_url, headers=headers), timeout=30) as response:
                current = json.load(response)

            schema = json.loads(base64.b64decode(current["content"]).decode("utf-8"))
            for field in ("woodpeckerServerTag", "woodpeckerAgentTag"):
                prop = schema["properties"][field]
                versions = [v for v in prop.get("enum", []) if isinstance(v, str) and v != version]
                prop["enum"] = [version, *versions][:50]

            payload = json.dumps({
                "message": f"catalog(woodpecker): {version}",
                "content": base64.b64encode((json.dumps(schema, indent=2) + "\n").encode("utf-8")).decode("ascii"),
                "sha": current["sha"],
                "branch": "master",
                "committer": {"name": "LHA Play CI", "email": "ci@lhaplay.com"},
            }).encode("utf-8")

            request = urllib.request.Request(
                write_url,
                data=payload,
                headers={**headers, "Content-Type": "application/json"},
                method="PUT",
            )
            try:
                with urllib.request.urlopen(request, timeout=30) as response:
                    result = json.load(response)
                print(f"Published selectable Cyclops Woodpecker version {version} in {result['commit']['sha']}")
                break
            except urllib.error.HTTPError as error:
                if error.code in (409, 422) and attempt < 5:
                    time.sleep(attempt)
                    continue
                body = error.read().decode("utf-8", "replace")
                raise SystemExit(f"Cyclops version catalog update failed: HTTP {error.code}: {body}") from error
        else:
            raise SystemExit("Cyclops version catalog update failed after retries")
        PY

  - name: release summary
    image: alpine:3.23
    depends_on:
      - publish version to cyclops catalog
    commands:
      - |
        set -eu
        echo "LHA Play CI $CI_COMMIT_TAG published from Git tag."
        echo "Source: $CI_COMMIT_SHA"
        echo "Server tags: $CI_COMMIT_TAG, $CI_COMMIT_SHA, v3.17-lha, latest"
        echo "Agent tags:  $CI_COMMIT_TAG, $CI_COMMIT_SHA, v3.17-lha, latest"
        echo "Cyclops catalog updated. Deployment requires explicit selection/reconcile in Cyclops."
