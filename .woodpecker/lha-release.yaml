when:
  - event: tag

steps:
  - name: validate lha release tag
    image: alpine/git
    commands:
      - |
        set -eu
        LHA_VERSION="$CI_COMMIT_TAG"
        case "$LHA_VERSION" in
          v3.17-lha-[0-9]*.[0-9]*.[0-9]*) ;;
          *) echo "Invalid LHA release tag: $LHA_VERSION (expected v3.17-lha-<semver>)" >&2; exit 1 ;;
        esac
        test -n "$CI_COMMIT_SHA"
        BRANCH_SHA="$(git ls-remote origin refs/heads/v3.17-lha | awk '{print $1}')"
        test -n "$BRANCH_SHA"
        if [ "$CI_COMMIT_SHA" != "$BRANCH_SHA" ]; then
          echo "Release tag $LHA_VERSION points to $CI_COMMIT_SHA, but v3.17-lha currently points to $BRANCH_SHA." >&2
          echo "Refusing to move v3.17-lha/latest image aliases backwards. Tag the current v3.17-lha tip instead." >&2
          exit 1
        fi
        echo "LHA Play CI release: $LHA_VERSION"
        echo "Source commit: $CI_COMMIT_SHA"
        echo "v3.17-lha tip: $BRANCH_SHA"

  - name: publish lha server
    image: woodpeckerci/plugin-kaniko
    depends_on:
      - validate lha release tag
    settings:
      registry: registry.lhaplay.com
      repo: woodpecker/server
      dockerfile: docker/Dockerfile.server.fork
      context: .
      tags:
        - ${CI_COMMIT_SHA}
        - ${CI_COMMIT_TAG}
        - v3.17-lha
        - latest
      build_args:
        - LHA_WOODPECKER_VERSION=${CI_COMMIT_TAG}
      username: lha-registry
      password:
        from_secret: registry_password

  - name: publish lha agent
    image: woodpeckerci/plugin-kaniko
    depends_on:
      - validate lha release tag
    settings:
      registry: registry.lhaplay.com
      repo: woodpecker/agent
      dockerfile: docker/Dockerfile.agent.alpine.multiarch
      context: .
      tags:
        - ${CI_COMMIT_SHA}
        - ${CI_COMMIT_TAG}
        - v3.17-lha
        - latest
      build_args:
        - LHA_WOODPECKER_VERSION=${CI_COMMIT_TAG}
        - CI_COMMIT_SHA=${CI_COMMIT_SHA}
      username: lha-registry
      password:
        from_secret: registry_password

  - name: release summary
    image: alpine:3.23
    depends_on:
      - publish lha server
      - publish lha agent
    commands:
      - |
        set -eu
        echo "LHA Play CI $CI_COMMIT_TAG published from Git tag."
        echo "Source: $CI_COMMIT_SHA"
        echo "Server tags: $CI_COMMIT_TAG, $CI_COMMIT_SHA, v3.17-lha, latest"
        echo "Agent tags:  $CI_COMMIT_TAG, $CI_COMMIT_SHA, v3.17-lha, latest"
        echo "Deployment remains an explicit host-side operation."
