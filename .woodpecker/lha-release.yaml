when:
  - event: tag

steps:
  - name: validate lha release tag
    image: alpine/git
    commands:
      - |
        set -eu
        LHA_VERSION="$CI_COMMIT_TAG"
        case "$LHA_VERSION" in
          v3.17-lha-[0-9]*.[0-9]*.[0-9]*) ;;
          *) echo "Invalid LHA release tag: $LHA_VERSION (expected v3.17-lha-<semver>)" >&2; exit 1 ;;
        esac
        test -n "$CI_COMMIT_SHA"
        BRANCH_SHA="$(git ls-remote origin refs/heads/v3.17-lha | awk '{print $1}')"
        test -n "$BRANCH_SHA"
        if [ "$CI_COMMIT_SHA" != "$BRANCH_SHA" ]; then
          echo "Release tag $LHA_VERSION points to $CI_COMMIT_SHA, but v3.17-lha currently points to $BRANCH_SHA." >&2
          echo "Refusing to move v3.17-lha/latest image aliases backwards. Tag the current v3.17-lha tip instead." >&2
          exit 1
        fi
        echo "LHA Play CI release: $LHA_VERSION"
        echo "Source commit: $CI_COMMIT_SHA"
        echo "v3.17-lha tip: $BRANCH_SHA"

  - name: publish lha server
    image: woodpeckerci/plugin-kaniko
    depends_on:
      - validate lha release tag
    settings:
      registry: registry.lhaplay.com
      repo: woodpecker/server
      dockerfile: docker/Dockerfile.server.fork
      context: .
      tags:
        - ${CI_COMMIT_SHA}
        - ${CI_COMMIT_TAG}
        - v3.17-lha
        - latest
      build_args:
        - LHA_WOODPECKER_VERSION=${CI_COMMIT_TAG}
      username: lha-registry
      password:
        from_secret: registry_password

  - name: publish lha agent
    image: woodpeckerci/plugin-kaniko
    depends_on:
      - validate lha release tag
    settings:
      registry: registry.lhaplay.com
      repo: woodpecker/agent
      dockerfile: docker/Dockerfile.agent.alpine.multiarch
      context: .
      tags:
        - ${CI_COMMIT_SHA}
        - ${CI_COMMIT_TAG}
        - v3.17-lha
        - latest
      build_args:
        - LHA_WOODPECKER_VERSION=${CI_COMMIT_TAG}
        - CI_COMMIT_SHA=${CI_COMMIT_SHA}
      username: lha-registry
      password:
        from_secret: registry_password

  - name: update gitops deployment
    image: alpine/git
    depends_on:
      - publish lha server
      - publish lha agent
    environment:
      GITOPS_TOKEN:
        from_secret: gitops_token
    commands:
      - |
        set -eu
        if [ -z "${GITOPS_TOKEN:-}" ]; then
          echo "Missing Woodpecker secret: gitops_token" >&2
          echo "Create it for this repository or organization and allow it for tag events." >&2
          exit 1
        fi
        rm -rf /tmp/lha-infrastructure-versions
        GITOPS_URL="https://x-access-token:${GITOPS_TOKEN}@github.com/bredchalice/lha-infrastructure-versions.git"
        git clone --depth=1 --branch master "$GITOPS_URL" /tmp/lha-infrastructure-versions
        cd /tmp/lha-infrastructure-versions
        git remote set-url origin https://github.com/bredchalice/lha-infrastructure-versions.git
        KUSTOMIZATION=apps/woodpecker/kustomization.yaml
        test -f "$KUSTOMIZATION"
        sed -i "s#newTag: v3\.17-lha\(-[0-9][0-9.]*\)\{0,1\}#newTag: $CI_COMMIT_TAG#g" "$KUSTOMIZATION"
        test "$(grep -c "newTag: $CI_COMMIT_TAG" "$KUSTOMIZATION")" -eq 2
        git diff --check
        if git diff --quiet -- "$KUSTOMIZATION"; then
          echo "GitOps already points at $CI_COMMIT_TAG"
          exit 0
        fi
        git config user.name "LHA Play CI"
        git config user.email "ci@lhaplay.com"
        git add "$KUSTOMIZATION"
        git commit -m "deploy(woodpecker): $CI_COMMIT_TAG"
        git push "$GITOPS_URL" HEAD:master
        echo "GitOps desired version updated to $CI_COMMIT_TAG; Argo CD will reconcile it."

  - name: release summary
    image: alpine:3.23
    depends_on:
      - update gitops deployment
    commands:
      - |
        set -eu
        echo "LHA Play CI $CI_COMMIT_TAG published and promoted from Git tag."
        echo "Source: $CI_COMMIT_SHA"
        echo "Server tags: $CI_COMMIT_TAG, $CI_COMMIT_SHA, v3.17-lha, latest"
        echo "Agent tags:  $CI_COMMIT_TAG, $CI_COMMIT_SHA, v3.17-lha, latest"
        echo "GitOps: apps/woodpecker/kustomization.yaml -> $CI_COMMIT_TAG"
        echo "Argo CD owns the Kubernetes rollout."
