name: Validate manual inputs fork

on:
  push:
    branches:
      - feature/manual-run-inputs
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Enable Corepack
        run: corepack enable
      - name: Go tests
        run: go test ./pipeline/frontend/yaml/... ./server/api -run 'Test(ParseManual|ManualNormalize|ApplyManual)' -count=1
      - name: UI dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: UI typecheck
        working-directory: web
        run: pnpm typecheck

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build fork server image
        run: docker build -f docker/Dockerfile.server.fork -t woodpecker-server-lha:test .
